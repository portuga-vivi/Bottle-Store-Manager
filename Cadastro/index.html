<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Money Journal</title>

    <!-- <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
-->
    <link rel="stylesheet" href="../sweetalert/sweetalert2.min.css" />
    <script src="../sweetalert/sweetalert2.all.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <form action="insert.php" method="post" enctype="multipart/form-data">
        <input type="hidden" name="dataa" id="today2" />

        <div class="header">
          <div class="top-bar2">
            <a href="../index.php">
              <img id="index_img" src="../Pics/gerais/home.png" />
            </a>
          </div>

          <div class="top-bar">
            <a href="../cadastro">
              <img id="cadastro_img" src="../Pics/gerais/cadastro.png" />
            </a>
          </div>
        </div>

        <h3 id="today" na style="align-content: center"></h3>
        <h1>Cadastro de Produtos <br />-No Distrito-</h1>

        <h2>1) Tipo de Produto</h2>
        <div class="habit-list">
          <div style="display: flex">
            <label
              ><input value="CERVEJAS" name="tipo" type="checkbox" />
              CERVEJAS</label
            >
            <label
              ><input value="SECAS" name="tipo" type="checkbox" /> SECAS</label
            >
          </div>
          <div style="display: flex">
            <label
              ><input value="VINHOS" name="tipo" type="checkbox" />
              VINHOS</label
            ><label>
              <input name="tipo" value="CIDRAS" type="checkbox" /> CIDRAS</label
            >
          </div>
          <label
            ><input name="tipo" value="OUTRAS BEBIDAS" type="checkbox" /> OUTRAS
            BEBIDAS</label
          >
          <label
            ><input name="tipo" value="OUTROS PRODUTOS" type="checkbox" />
            OUTROS PRODUTOS</label
          >
        </div>

        <h2>2) Nome do produto</h2>
        <input
          type="text"
          maxlength="20"
          name="marca"
          placeholder="Marca ou especificação do produto"
        />

        <h2>2) Preço do produto</h2>
        <input
          type="number"
          name="preco"
          step="any"
          placeholder="Quanto custa"
        />

        <h2>2) Miniatura do produto</h2>
        <label class="upload-label"
          >Selecione uma Miniatura para o produto:</label
        ><br />
        <input class="upload-input" type="file" name="link" required /><br />

        <br />
        <button type="submit" name="submit">Cadastrar Produto</button>

        <div class="footer">No Distrito,o lugar perfeito para Espairecer.</div>
      </form>
    </div>
    <script>
      const checkboxes = document.querySelectorAll(
        '.habit-list input[type="checkbox"]'
      );

      checkboxes.forEach((cb) => {
        cb.addEventListener("change", () => {
          if (cb.checked) {
            checkboxes.forEach((other) => {
              if (other !== cb) other.checked = false;
            });
          }
        });
      });

      function pad(n) {
        return n < 10 ? "0" + n : n;
      }

      const d = new Date();
      const formatted =
        pad(d.getDate()) +
        "/" +
        pad(d.getMonth() + 1) +
        "/" +
        d.getFullYear() +
        " " +
        pad(d.getHours()) +
        ":" +
        pad(d.getMinutes()) +
        ":" +
        pad(d.getSeconds());

      document.getElementById("today").innerHTML = formatted;
      document.getElementById("today2").value = formatted;
    </script>
  </body>
</html>
