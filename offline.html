<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Offline</title>
    <style>
      body {
        font-family: system-ui;
        margin: 0;
        display: grid;
        place-items: center;
        height: 100vh;
        background: #111827;
        color: #fff;
      }
      .box {
        max-width: 420px;
        padding: 24px;
        border: 1px solid #334155;
        border-radius: 16px;
        background: #0b1220;
      }
      p {
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Estás offline</h2>
      <p>
        Podes continuar a registar vendas. Elas serão sincronizadas quando
        voltar a ter internet.
      </p>
    </div>
  </body>
</html>
